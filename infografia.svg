<svg xmlns="http://www.w3.org/2000/svg" width="800" height="2000" viewBox="0 0 800 2000" role="img" aria-labelledby="title desc"><title id="title">Seguridad aérea: cuatro claves para comprenderla</title><desc id="desc">Mitos y evidencia; registradores FDR y CVR; prevención de FOD; interacción entre personas, tecnología y organización.</desc><rect width="800" height="2000" fill="#080a0b"/><rect x="48" y="48" width="8" height="36" fill="#ffcf24"/><text x="74" y="73" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">MÁS ALLÁ DEL VUELO / INVESTIGACIÓN</text><text x="48" y="155" font-family="Arial,sans-serif" font-size="75" font-weight="bold" fill="#efefea">SEGURIDAD</text><text x="48" y="234" font-family="Arial,sans-serif" font-size="75" font-weight="bold" fill="#ffcf24">AÉREA.</text><text x="50" y="285" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#efefea">Cuatro claves para comprender cómo se previene</text><text x="50" y="320" font-family="Arial,sans-serif" font-size="24" font-weight="normal" fill="#efefea">el riesgo y se aprende de la experiencia.</text><path d="M625 104l14 76 87 47v13l-86-24-5 48 25 20v10l-35-10-35 10v-10l25-20-5-48-86 24v-13l87-47z" fill="#ffcf24"/><path d="M48 360h704" stroke="#3a3f42"/><text x="48" y="408" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#ffcf24">01</text><text x="133" y="398" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#efefea">MITOS Y REALIDADES</text><text x="48" y="460" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">Un movimiento fuerte no demuestra por sí solo</text><text x="48" y="492" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">que el avión vaya a caer. La explicación debe</text><text x="48" y="524" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">considerar la amenaza y las protecciones.</text><rect x="48" y="570" width="218" height="40" fill="#1b2022" stroke="#ffcf24"/><text x="60" y="596" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">CREENCIA</text><rect x="285" y="570" width="218" height="40" fill="#1b2022" stroke="#ffcf24"/><text x="297" y="596" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">EVIDENCIA</text><rect x="522" y="570" width="218" height="40" fill="#1b2022" stroke="#ffcf24"/><text x="534" y="596" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">PREVENCIÓN</text><text x="48" y="642" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#ffcf24">DECISIÓN: cinturón mientras ocupas el asiento.</text><text x="48" y="680" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#aeb6ba">FAA, Turbulence; NTSB (2021).</text><path d="M48 708h704" stroke="#3a3f42"/><text x="48" y="743" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#ffcf24">02</text><text x="133" y="733" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#efefea">REGISTRADORES DE VUELO</text><text x="48" y="795" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">FDR: parámetros del vuelo y de los sistemas.</text><text x="48" y="827" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">CVR: sonidos y comunicaciones de cabina.</text><text x="48" y="859" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">Se contrastan con otras evidencias del suceso.</text><rect x="48" y="905" width="330" height="40" fill="#ffcf24"/><text x="65" y="931" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#080a0b">FDR · DATOS</text><rect x="403" y="905" width="330" height="40" fill="#ffcf24"/><text x="420" y="931" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#080a0b">CVR · AUDIO</text><text x="48" y="977" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#ffcf24">APRENDIZAJE: registrar ayuda a reconstruir hechos.</text><text x="48" y="1015" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#aeb6ba">Walker (2017); fuentes institucionales del artículo.</text><path d="M48 1043h704" stroke="#3a3f42"/><text x="48" y="1078" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#ffcf24">03</text><text x="133" y="1068" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#efefea">PREVENCIÓN DE FOD</text><text x="48" y="1130" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">Un objeto extraño puede causar daños.</text><text x="48" y="1162" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">Prevenir, detectar, retirar de forma coordinada</text><text x="48" y="1194" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">y evaluar hallazgos forman un ciclo de control.</text><text x="48" y="1266" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">PREVENIR</text><text x="228" y="1266" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">DETECTAR</text><text x="408" y="1266" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">RETIRAR</text><text x="588" y="1266" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">EVALUAR</text><text x="48" y="1312" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#ffcf24">ACCIÓN: reporta; no ingreses sin autorización.</text><text x="48" y="1350" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#aeb6ba">FAA, gestión de FOD; Shan et al. (2025).</text><path d="M48 1378h704" stroke="#3a3f42"/><text x="48" y="1413" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#ffcf24">04</text><text x="133" y="1403" font-family="Arial,sans-serif" font-size="27" font-weight="bold" fill="#efefea">FACTOR HUMANO Y SISTEMAS</text><text x="48" y="1465" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">La atención y la comunicación interactúan con</text><text x="48" y="1497" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">la tecnología y las condiciones de trabajo.</text><text x="48" y="1529" font-family="Arial,sans-serif" font-size="23" font-weight="normal" fill="#efefea">Automatizar también exige comprender y supervisar.</text><text x="48" y="1601" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">PERSONAS</text><text x="283" y="1601" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">TECNOLOGÍA</text><text x="518" y="1601" font-family="Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffcf24">ORGANIZACIÓN</text><text x="48" y="1647" font-family="Arial,sans-serif" font-size="19" font-weight="normal" fill="#ffcf24">CLAVE: formación, procedimientos y coordinación.</text><text x="48" y="1685" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#aeb6ba">Sarter (2008); Causse et al. (2025).</text><path d="M48 1713h704" stroke="#3a3f42"/><text x="48" y="1800" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#ffcf24">LA SEGURIDAD ES UN TRABAJO CONJUNTO.</text><text x="48" y="1840" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#efefea">Esta síntesis no sustituye procedimientos ni formación operacional.</text><text x="48" y="1880" font-family="Arial,sans-serif" font-size="18" font-weight="normal" fill="#efefea">Fuentes completas: sección «Fuentes» del blog.</text><text x="48" y="1915" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#aeb6ba">Gráficos vectoriales elaborados para esta infografía.</text><text x="48" y="1950" font-family="Arial,sans-serif" font-size="16" font-weight="normal" fill="#aeb6ba">Blog académico · IAM24-07A · Noviembre de 2026</text></svg>